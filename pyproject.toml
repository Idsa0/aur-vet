[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurvet"
version = "0.1.0"
description = "Heuristic pre-install screening for AUR packages (read-only; proves nothing safe)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Packaging",
]

[project.scripts]
aurvet = "aurvet.__main__:main"

[tool.setuptools.packages.find]
include = ["aurvet*"]
